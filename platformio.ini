[env:esp32devkitv1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

# Recuerda verificar si el puerto COM cambia al conectar la nueva placa
upload_port = COM1
monitor_port = COM1

build_flags = 
    -D MQTT_MAX_PACKET_SIZE=512

lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.18.5
    https://github.com/io7lab/IO7F32.git
    adafruit/Adafruit ADS1X15 @ ^2.5.0