[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 921600 

; Recuerda verificar si tu puerto sigue siendo el COM15 o si cambió al conectar el otro
monitor_port = COM7
upload_port = COM7

; Sistema de archivos nativo para ESP8266 (Equivalente a LittleFS en esta plataforma)
board_build.filesystem = littlefs 

build_flags = 
    -D MQTT_MAX_PACKET_SIZE=1024
    -D DEBUG_ESP_PORT=Serial    ; Reemplazo de CORE_DEBUG_LEVEL para ESP8266 si necesitas debugear la radio

lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.18.5
    ; Nota: Removí temporalmente la librería IO7F32 porque está diseñada específicamente para ESP32.
    ; Si necesitas usarla más adelante para otra cosa, me avisas para ver si tiene fork de ESP8266.