[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 921600 

monitor_port = COM7
upload_port = COM7

board_build.filesystem = littlefs 

build_flags = 
    -D MQTT_MAX_PACKET_SIZE=1024
    -D DEBUG_ESP_PORT=Serial    

lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.18.5
    io7lab/IO7F8266@^0.1.1